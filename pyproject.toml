[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "see-viewer"
version = "0.3.0"
description = "see: a mouse- and trackpad-friendly viewer for the terminal (kitty graphics protocol: Ghostty, kitty, WezTerm). Opens PDFs, images, Office documents, text, animations and video."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["pypdfium2>=4.0", "Pillow>=10.0"]
keywords = ["pdf", "viewer", "terminal", "kitty", "ghostty", "tui"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/Youkin06/see"

[project.scripts]
see = "see.app:main"

[tool.setuptools.packages.find]
where = ["src"]
